# SECOND Dataset Configuration (Semantic Change Detection)
dataset:
  name: SECOND
  root: /storage2/ChangeDetection/MV/Datasets/SECOND          # update to actual path
  train_split: train
  val_split: val
  test_split: test
  image_size: 256
  batch_size: 8
  num_workers: 8
  augmentation: true
  debug_stats: false
  val_ratio: 0.2
  ignore_index: 255
  num_classes: 7
  task_type: semantic_change
  mode: semantic
  binary: false
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

task: semantic_cd

metrics:
  task: second_scd
  allowed: [OA, mIoU, SeK, Fscd]
  average_mode: global

model:
  name: MambaRefineCD
  variant: a4_full
  output_mode: semantic_change
  enable_semantic_heads: true
  semantic_head:
    enabled: true
    num_classes: 7
    channels: 128
    share_head: true
    dropout: 0.0

loss:
  type: second_semantic_cd
  second:
    sem_ce_weight: 1.0
    sem_dice_weight: 0.5
    change_weight: 0.5
    consistency_weight: 0.1
    ignore_index: 255

train:
  ema:
    enabled: true
    decay: 0.999
  save_best_by: Fscd

eval:
  use_ema: true
  save_predictions: true
  save_visualizations: true

checkpoint:
  selection_metric: Fscd
  monitor: Fscd
  mode: max
