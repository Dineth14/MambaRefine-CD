# MambaRefineCD Base Model Configuration
# Closest to current default behavior: D-RBI enabled, adaptive_rf decoder,
# signed diff off, CRAM-lite off, boundary loss at default settings.

model:
  mode: dual
  backbone: mambavision
  variant: base
  decoder: adaptive_rf
  pretrained: true
  output_mode: binary
  enable_semantic_heads: false
  semantic_head_type: lightweight
  semantic_num_classes: 7
  num_classes: 1
  return_features: false
  freeze_backbone: false
  cram_lite:
    enabled: false

difference:
  enabled: true
  out_channels: 256
  use_depthwise: true
  use_absdiff: true
  use_signed_diff: false       # <── base: signed diff disabled
  use_product: false
  product_scale: 0.25
  pre_norm: true
  use_region_gate: true
  use_boundary_gate: true
  region_gate_min: 0.2
  region_gate_max: 0.8
  boundary_gate_min: 0.0
  boundary_gate_max: 0.4
  gate_hidden_ratio: 0.25

decoder:
  channels: 256
  dilation_rates: [1, 2, 4, 8]
  use_boundary_residual: true
  residual_scale: 0.1
  use_depthwise: true

hardware:
  device: cuda
  mixed_precision: true

training:
  max_iterations: 50000
  batch_size: 8
  lr: 5.0e-5
  optimizer: adamw
  scheduler: cosine
  warmup_iterations: 2500
  validate_every: 5000
  log_every: 20
  gradient_clip: 0.5
  weight_decay: 0.01

loss:
  final:
    type: bce_dice
    bce_weight: 1.0
    dice_weight: 1.0
  coarse:
    enabled: true
    weight: 0.4
  boundary:
    enabled: true
    weight: 0.1
    type: bce_dice
    target_type: sobel
    edge_width: 3
