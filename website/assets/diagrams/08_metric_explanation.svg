<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Metric explanation</title>
  <desc id="desc">Diagram explaining how different metrics emphasize different properties.</desc>
  <rect width="980" height="560" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="74" y="86" width="248" height="380" rx="30" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.4"/>
    <text x="198" y="138" text-anchor="middle" font-size="28" fill="#24323a">Confusion counts</text>
    <rect x="116" y="176" width="90" height="84" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="220" y="176" width="90" height="84" rx="18" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <rect x="116" y="274" width="90" height="84" rx="18" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <rect x="220" y="274" width="90" height="84" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <text x="161" y="226" text-anchor="middle" font-size="20" fill="#416957">TP</text>
    <text x="265" y="226" text-anchor="middle" font-size="20" fill="#7c6646">FP</text>
    <text x="161" y="324" text-anchor="middle" font-size="20" fill="#7c6646">FN</text>
    <text x="265" y="324" text-anchor="middle" font-size="20" fill="#2f4b5e">TN</text>
    <text x="198" y="412" text-anchor="middle" font-size="18" fill="#5e6b73">all binary metrics are derived from these counts</text>

    <path d="M322 276 H438" stroke="#48697d" stroke-width="3" fill="none"/>
    <polygon points="438,276 420,266 420,286" fill="#48697d"/>

    <rect x="458" y="92" width="194" height="124" rx="24" fill="#e3efe8" stroke="#9fc0af" stroke-width="2.2"/>
    <rect x="458" y="236" width="194" height="124" rx="24" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <rect x="458" y="380" width="194" height="96" rx="24" fill="#f0e9dc" stroke="#c4b294" stroke-width="2.2"/>
    <text x="555" y="146" text-anchor="middle" font-size="24" fill="#416957">F1_1, IoU_1</text>
    <text x="555" y="176" text-anchor="middle" font-size="16" fill="#5e6b73">changed-class quality</text>
    <text x="555" y="290" text-anchor="middle" font-size="24" fill="#2f4b5e">mF1, mIoU</text>
    <text x="555" y="320" text-anchor="middle" font-size="16" fill="#5e6b73">mean over both classes</text>
    <text x="555" y="426" text-anchor="middle" font-size="24" fill="#7c6646">OA</text>
    <text x="555" y="454" text-anchor="middle" font-size="16" fill="#5e6b73">background can dominate</text>

    <path d="M652 154 H874" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M652 298 H874" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M652 428 H874" stroke="#48697d" stroke-width="3" fill="none"/>

    <rect x="874" y="100" width="52" height="108" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="874" y="244" width="52" height="108" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="874" y="374" width="52" height="108" rx="18" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <text x="900" y="154" text-anchor="middle" font-size="14" fill="#416957" transform="rotate(-90 900 154)">changed pixels</text>
    <text x="900" y="298" text-anchor="middle" font-size="14" fill="#2f4b5e" transform="rotate(-90 900 298)">balance</text>
    <text x="900" y="428" text-anchor="middle" font-size="14" fill="#7c6646" transform="rotate(-90 900 428)">overall only</text>

    <text x="490" y="522" text-anchor="middle" font-size="18" fill="#5e6b73">Because no-change dominates, mean and overall scores can look stronger than the changed-class score. Report both.</text>
  </g>
</svg>
