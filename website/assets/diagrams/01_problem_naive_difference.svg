<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Naive difference weakness</title>
  <desc id="desc">Diagram showing that naive differencing mixes semantic change, pseudo-change, and background effects.</desc>
  <rect width="960" height="560" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="56" y="72" width="220" height="128" rx="24" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="56" y="232" width="220" height="128" rx="24" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="56" y="392" width="220" height="112" rx="24" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <text x="166" y="126" text-anchor="middle" font-size="26" fill="#2f4b5e">Shared Feature</text>
    <text x="166" y="156" text-anchor="middle" font-size="20" fill="#2f4b5e">at time 1</text>
    <text x="166" y="286" text-anchor="middle" font-size="26" fill="#416957">Shared Feature</text>
    <text x="166" y="316" text-anchor="middle" font-size="20" fill="#416957">at time 2</text>
    <text x="166" y="448" text-anchor="middle" font-size="25" fill="#7c6646">Absolute difference</text>

    <path d="M300 136 H418" fill="none" stroke="#48697d" stroke-width="3"/>
    <path d="M300 296 H418" fill="none" stroke="#48697d" stroke-width="3"/>
    <polygon points="418,136 400,126 400,146" fill="#48697d"/>
    <polygon points="418,296 400,286 400,306" fill="#48697d"/>

    <rect x="438" y="154" width="180" height="124" rx="28" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.2"/>
    <text x="528" y="214" text-anchor="middle" font-size="28" fill="#233039">|F₂ - F₁|</text>
    <text x="528" y="246" text-anchor="middle" font-size="17" fill="#5e6b73">naive temporal magnitude</text>

    <path d="M640 216 H734" fill="none" stroke="#48697d" stroke-width="3"/>
    <polygon points="734,216 716,206 716,226" fill="#48697d"/>

    <rect x="752" y="72" width="156" height="116" rx="22" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="752" y="222" width="156" height="116" rx="22" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <rect x="752" y="372" width="156" height="116" rx="22" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <text x="830" y="116" text-anchor="middle" font-size="21" fill="#2f4b5e">Pseudo-change</text>
    <text x="830" y="144" text-anchor="middle" font-size="16" fill="#5e6b73">illumination</text>
    <text x="830" y="266" text-anchor="middle" font-size="21" fill="#7c6646">Boundary blur</text>
    <text x="830" y="294" text-anchor="middle" font-size="16" fill="#5e6b73">mixed edges</text>
    <text x="830" y="416" text-anchor="middle" font-size="21" fill="#416957">Background bias</text>
    <text x="830" y="444" text-anchor="middle" font-size="16" fill="#5e6b73">no-change dominates</text>

    <path d="M618 216 C684 216 690 130 752 130" fill="none" stroke="#7f94a2" stroke-width="2.4" stroke-dasharray="7 7"/>
    <path d="M618 216 C684 216 690 280 752 280" fill="none" stroke="#b9a17f" stroke-width="2.4" stroke-dasharray="7 7"/>
    <path d="M618 216 C684 216 690 430 752 430" fill="none" stroke="#7aa08d" stroke-width="2.4" stroke-dasharray="7 7"/>

    <text x="478" y="48" font-size="28" fill="#24323a" text-anchor="middle">Why naive difference is weak</text>
    <text x="478" y="520" font-size="18" fill="#5e6b73" text-anchor="middle">One absolute-difference tensor must simultaneously explain semantic change, nuisance variation, and edge localization.</text>
  </g>
</svg>
