<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="840" height="380" fill="#f8fafc"/>

  <!-- Section headings -->
  <text x="200" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#b45309">Naive Differencing</text>
  <text x="624" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">Structured Comparison (D-RBI)</text>

  <!-- Vertical divider -->
  <line x1="418" y1="10" x2="418" y2="370" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- =================== LEFT: NAIVE =================== -->
  <!-- Input feature blocks -->
  <rect x="28" y="68" width="88" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="92" text-anchor="middle" font-family="system-ui" font-size="12" fill="#1e40af">Feature F&#x2081;</text>

  <rect x="28" y="120" width="88" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="144" text-anchor="middle" font-family="system-ui" font-size="12" fill="#1e40af">Feature F&#x2082;</text>

  <!-- Converging arrows to abs diff -->
  <line x1="116" y1="87" x2="160" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="116" y1="139" x2="160" y2="124" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- |F2 - F1| block -->
  <rect x="163" y="102" width="104" height="46" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="215" y="122" text-anchor="middle" font-family="system-ui" font-size="12" fill="#78350f">|F&#x2082; &#x2212; F&#x2081;|</text>
  <text x="215" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#92400e">single stream</text>

  <!-- Arrows to three outputs -->
  <line x1="267" y1="113" x2="298" y2="96"  stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="267" y1="125" x2="298" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="267" y1="136" x2="298" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output 1: True Change (ok) -->
  <rect x="301" y="70" width="106" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="354" y="86" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#166534">&#x2713; True Change</text>
  <text x="354" y="103" text-anchor="middle" font-family="system-ui" font-size="10" fill="#166534">correctly active</text>

  <!-- Output 2: Pseudo-change (bad) -->
  <rect x="301" y="120" width="106" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="354" y="136" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#991b1b">&#x2717; Pseudo-Change</text>
  <text x="354" y="153" text-anchor="middle" font-family="system-ui" font-size="10" fill="#991b1b">shadows, seasons</text>

  <!-- Output 3: Weak boundary (bad) -->
  <rect x="301" y="170" width="106" height="40" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="354" y="186" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#9a3412">&#x2717; Weak Boundary</text>
  <text x="354" y="203" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9a3412">edges blurred</text>

  <!-- Problem note -->
  <rect x="22" y="240" width="382" height="118" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="213" y="260" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#9a3412">Why This Fails</text>
  <text x="213" y="279" text-anchor="middle" font-family="system-ui" font-size="11" fill="#78350f">&#x2022; Discards agreement signal (F&#x2081; &#x2299; F&#x2082;)</text>
  <text x="213" y="297" text-anchor="middle" font-family="system-ui" font-size="11" fill="#78350f">&#x2022; Pseudo-change activates as strongly as true change</text>
  <text x="213" y="315" text-anchor="middle" font-family="system-ui" font-size="11" fill="#78350f">&#x2022; Cannot separate region interior from boundary</text>
  <text x="213" y="333" text-anchor="middle" font-family="system-ui" font-size="11" fill="#78350f">&#x2022; Background pixels dominate gradient landscape</text>

  <!-- =================== RIGHT: D-RBI =================== -->
  <!-- Input feature blocks -->
  <rect x="432" y="68" width="88" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="476" y="92" text-anchor="middle" font-family="system-ui" font-size="12" fill="#1e40af">Feature F&#x2081;</text>

  <rect x="432" y="120" width="88" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="476" y="144" text-anchor="middle" font-family="system-ui" font-size="12" fill="#1e40af">Feature F&#x2082;</text>

  <!-- Arrows to phi block -->
  <line x1="520" y1="87" x2="560" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="139" x2="560" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- φ compression block -->
  <rect x="563" y="92" width="122" height="66" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="624" y="113" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#4c1d95">&#x03C6; ( concat )</text>
  <text x="624" y="130" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5b21b6">F&#x2081;, F&#x2082;, |diff|, product</text>
  <text x="624" y="148" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5b21b6">&#x2192; D&#x2097; (4 cues)</text>

  <!-- Arrows from phi to two output branches -->
  <line x1="685" y1="107" x2="715" y2="93"  stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="685" y1="142" x2="715" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Region stream -->
  <rect x="718" y="68" width="106" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="771" y="86" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#166534">Region R&#x2097;</text>
  <text x="771" y="103" text-anchor="middle" font-family="system-ui" font-size="10" fill="#166534">semantic gate G&#x1D63;</text>

  <!-- Boundary stream -->
  <rect x="718" y="136" width="106" height="46" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="771" y="154" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#9d174d">Boundary B&#x2097;</text>
  <text x="771" y="171" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9d174d">gradient gate G&#x1D47;</text>

  <!-- Benefit note -->
  <rect x="428" y="240" width="390" height="118" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="623" y="260" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#166534">D-RBI Advantages</text>
  <text x="623" y="279" text-anchor="middle" font-family="system-ui" font-size="11" fill="#166534">&#x2022; Retains agreement: F&#x2081; &#x2299; F&#x2082; in concatenation</text>
  <text x="623" y="297" text-anchor="middle" font-family="system-ui" font-size="11" fill="#166534">&#x2022; Region gate suppresses pseudo-change</text>
  <text x="623" y="315" text-anchor="middle" font-family="system-ui" font-size="11" fill="#166534">&#x2022; Boundary gate preserves thin edge evidence</text>
  <text x="623" y="333" text-anchor="middle" font-family="system-ui" font-size="11" fill="#166534">&#x2022; Bounded outputs prevent training instability</text>
</svg>
