<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">SECOND metrics overview</title>
  <desc id="desc">Diagram summarizing SECOND binary and semantic evaluation interpretation.</desc>
  <rect width="920" height="460" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="58" y="74" width="230" height="136" rx="24" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <rect x="58" y="252" width="230" height="136" rx="24" fill="#e3efe8" stroke="#9fc0af" stroke-width="2.2"/>
    <text x="173" y="126" text-anchor="middle" font-size="28" fill="#2f4b5e">Binary mode</text>
    <text x="173" y="160" text-anchor="middle" font-size="18" fill="#5e6b73">Y = 1[L1 != L2]</text>
    <text x="173" y="304" text-anchor="middle" font-size="28" fill="#416957">Semantic mode</text>
    <text x="173" y="338" text-anchor="middle" font-size="18" fill="#5e6b73">requires semantic prediction space</text>

    <path d="M288 142 H424" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M288 320 H424" stroke="#5f8370" stroke-width="3" fill="none"/>
    <polygon points="424,142 406,132 406,152" fill="#48697d"/>
    <polygon points="424,320 406,310 406,330" fill="#5f8370"/>

    <rect x="444" y="74" width="202" height="136" rx="24" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.2"/>
    <rect x="444" y="252" width="202" height="136" rx="24" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.2"/>
    <text x="545" y="120" text-anchor="middle" font-size="24" fill="#24323a">Evaluation family</text>
    <text x="545" y="158" text-anchor="middle" font-size="17" fill="#5e6b73">OA, Fscd, mIoU</text>
    <text x="545" y="336" text-anchor="middle" font-size="17" fill="#5e6b73">OA, Fscd, mIoU, SeK</text>

    <path d="M646 142 H804" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M646 320 H804" stroke="#48697d" stroke-width="3" fill="none"/>

    <rect x="804" y="74" width="70" height="136" rx="20" fill="#f0e9dc" stroke="#c4b294" stroke-width="2.2"/>
    <rect x="804" y="252" width="70" height="136" rx="20" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <text x="839" y="142" text-anchor="middle" font-size="14" fill="#7c6646" transform="rotate(-90 839 142)">binary fallback</text>
    <text x="839" y="320" text-anchor="middle" font-size="14" fill="#2f4b5e" transform="rotate(-90 839 320)">full semantics</text>

    <text x="460" y="432" font-size="18" text-anchor="middle" fill="#5e6b73">Always verify whether a reported SECOND number comes from binary fallback evaluation or from a genuine semantic prediction protocol.</text>
  </g>
</svg>
