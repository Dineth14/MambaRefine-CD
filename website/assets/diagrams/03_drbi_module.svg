    <text x="929" y="314" text-anchor="middle" font-size="16" fill="#416957" transform="rotate(-90 929 314)">to gates</text>

    <text x="490" y="64" text-anchor="middle" font-size="30" fill="#24323a">Differential Region–Boundary Interaction</text>
