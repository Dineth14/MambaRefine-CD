    <text x="127" y="494" text-anchor="middle" font-size="16" fill="#5e6b73">optional F1^l * F2^l</text>

    <path d="M202 160 H300" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M202 284 H300" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M202 408 H300" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M202 486 H300" stroke="#9d8764" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
    <polygon points="300,160 282,150 282,170" fill="#48697d"/>
    <polygon points="300,284 282,274 282,294" fill="#48697d"/>
    <polygon points="300,408 282,398 282,418" fill="#48697d"/>
    <polygon points="300,486 282,476 282,496" fill="#9d8764"/>

    <rect x="320" y="112" width="190" height="388" rx="26" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.4"/>
    <text x="415" y="164" text-anchor="middle" font-size="28" fill="#24323a">Concatenate</text>
    <text x="415" y="196" text-anchor="middle" font-size="18" fill="#5e6b73">structured temporal evidence</text>
    <text x="415" y="286" text-anchor="middle" font-size="22" fill="#24323a">Conv 1x1</text>
    <text x="415" y="322" text-anchor="middle" font-size="22" fill="#24323a">GN + GELU</text>
    <text x="415" y="360" text-anchor="middle" font-size="22" fill="#24323a">Conv 1x1</text>
    <text x="415" y="430" text-anchor="middle" font-size="16" fill="#5e6b73">compact bottleneck phi_l</text>

    <path d="M510 306 H636" stroke="#48697d" stroke-width="3" fill="none"/>
    <polygon points="636,306 618,296 618,316" fill="#48697d"/>

    <rect x="656" y="220" width="160" height="172" rx="26" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.3"/>
    <text x="736" y="280" text-anchor="middle" font-size="30" fill="#2f4b5e">D_l</text>
    <text x="736" y="320" text-anchor="middle" font-size="18" fill="#5e6b73">projected differential code</text>

    <path d="M816 306 H896" stroke="#48697d" stroke-width="3" fill="none"/>
