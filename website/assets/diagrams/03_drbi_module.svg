<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">D-RBI module</title>
  <desc id="desc">Structured D-RBI module with context, disagreement, optional product, and projection.</desc>
  <rect width="980" height="560" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="52" y="116" width="150" height="88" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
