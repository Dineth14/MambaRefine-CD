<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Full architecture diagram</title>
  <desc id="desc">Overview of MambaRefine-CD including shared encoder, D-RBI, adaptive RF decoder, and residual boundary refinement.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="150" width="180" height="90" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="70" y="470" width="180" height="90" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="160" y="205" text-anchor="middle" font-size="28" fill="#1e3a8a">Image A</text>
    <text x="160" y="525" text-anchor="middle" font-size="28" fill="#065f46">Image B</text>

    <rect x="330" y="120" width="240" height="470" rx="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="450" y="185" text-anchor="middle" font-size="34" fill="#0f172a">Shared</text>
    <text x="450" y="226" text-anchor="middle" font-size="34" fill="#0f172a">MambaVision</text>
    <text x="450" y="262" text-anchor="middle" font-size="18" fill="#475569">aligned four-scale features</text>
    <rect x="370" y="320" width="160" height="60" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="370" y="404" width="160" height="60" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="450" y="358" text-anchor="middle" font-size="24" fill="#1e3a8a">F1^l</text>
    <text x="450" y="442" text-anchor="middle" font-size="24" fill="#065f46">F2^l</text>

    <rect x="650" y="190" width="220" height="320" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="760" y="252" text-anchor="middle" font-size="32" fill="#0f172a">D-RBI</text>
    <text x="760" y="292" text-anchor="middle" font-size="18" fill="#475569">structured comparison</text>
    <text x="760" y="326" text-anchor="middle" font-size="18" fill="#475569">region gate + boundary gate</text>
    <rect x="690" y="380" width="140" height="52" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="690" y="446" width="140" height="52" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="760" y="414" text-anchor="middle" font-size="22" fill="#1e3a8a">R1..R4</text>
    <text x="760" y="480" text-anchor="middle" font-size="22" fill="#065f46">B1..B4</text>

    <rect x="950" y="130" width="250" height="220" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1075" y="190" text-anchor="middle" font-size="30" fill="#0f172a">Adaptive RF</text>
    <text x="1075" y="228" text-anchor="middle" font-size="18" fill="#475569">d = 1, 2, 4, 8</text>
    <text x="1075" y="258" text-anchor="middle" font-size="18" fill="#475569">top-down FPN fusion</text>
    <rect x="995" y="286" width="160" height="46" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="1075" y="316" text-anchor="middle" font-size="22" fill="#1e3a8a">Pc</text>

    <rect x="950" y="410" width="250" height="180" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1075" y="470" text-anchor="middle" font-size="28" fill="#0f172a">Boundary Refine</text>
    <text x="1075" y="508" text-anchor="middle" font-size="18" fill="#475569">B1 + sigmoid(Pc) + Sobel</text>
    <text x="1075" y="540" text-anchor="middle" font-size="18" fill="#475569">Pf = Pc + 0.05 tanh(Delta)</text>

    <path d="M250 195 H330" stroke="#2563eb" stroke-width="4" fill="none"/>
    <path d="M250 515 H330" stroke="#059669" stroke-width="4" fill="none"/>
    <path d="M570 350 H650" stroke="#2563eb" stroke-width="4" fill="none"/>
    <path d="M870 406 H950" stroke="#2563eb" stroke-width="4" fill="none"/>
    <path d="M1155 330 V410" stroke="#2563eb" stroke-width="4" fill="none"/>
    <polygon points="330,195 314,187 314,203" fill="#2563eb"/>
    <polygon points="330,515 314,507 314,523" fill="#059669"/>
    <polygon points="650,350 634,342 634,358" fill="#2563eb"/>
    <polygon points="950,406 934,398 934,414" fill="#2563eb"/>

    <text x="640" y="660" text-anchor="middle" font-size="22" fill="#475569">Shared encoder features are compared structurally, decoded through adaptive receptive fields, then refined by a bounded residual boundary head.</text>
  </g>
</svg>
