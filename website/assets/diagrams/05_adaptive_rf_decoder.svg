<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive RF decoder</title>
  <desc id="desc">Diagram of adaptive receptive field decoding and top-down fusion.</desc>
  <rect width="980" height="560" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="48" y="74" width="140" height="72" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="48" y="174" width="140" height="72" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="48" y="274" width="140" height="72" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="48" y="374" width="140" height="72" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <text x="118" y="118" text-anchor="middle" font-size="22" fill="#2f4b5e">R4</text>
    <text x="118" y="218" text-anchor="middle" font-size="22" fill="#2f4b5e">R3</text>
    <text x="118" y="318" text-anchor="middle" font-size="22" fill="#2f4b5e">R2</text>
    <text x="118" y="418" text-anchor="middle" font-size="22" fill="#2f4b5e">R1</text>

    <rect x="250" y="64" width="220" height="392" rx="26" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.4"/>
    <text x="360" y="116" text-anchor="middle" font-size="26" fill="#24323a">Adaptive RF block</text>
    <text x="360" y="148" text-anchor="middle" font-size="17" fill="#5e6b73">dilations 1, 2, 4, 8</text>
    <rect x="286" y="186" width="148" height="52" rx="16" fill="#e4eef3" stroke="#9bb8c9" stroke-width="1.8"/>
    <rect x="286" y="252" width="148" height="52" rx="16" fill="#e3efe8" stroke="#9fc0af" stroke-width="1.8"/>
    <rect x="286" y="318" width="148" height="52" rx="16" fill="#f0e9dc" stroke="#c4b294" stroke-width="1.8"/>
    <rect x="286" y="384" width="148" height="52" rx="16" fill="#e8eff4" stroke="#9bb8c9" stroke-width="1.8"/>
    <text x="360" y="219" text-anchor="middle" font-size="20" fill="#2f4b5e">d = 1</text>
    <text x="360" y="285" text-anchor="middle" font-size="20" fill="#416957">d = 2</text>
    <text x="360" y="351" text-anchor="middle" font-size="20" fill="#7c6646">d = 4</text>
    <text x="360" y="417" text-anchor="middle" font-size="20" fill="#2f4b5e">d = 8</text>

    <rect x="538" y="100" width="158" height="112" rx="22" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <text x="617" y="152" text-anchor="middle" font-size="24" fill="#416957">softmax</text>
    <text x="617" y="182" text-anchor="middle" font-size="17" fill="#5e6b73">learned branch weights</text>

    <rect x="538" y="264" width="158" height="112" rx="22" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <text x="617" y="316" text-anchor="middle" font-size="24" fill="#2f4b5e">Rbar_l</text>
    <text x="617" y="346" text-anchor="middle" font-size="17" fill="#5e6b73">weighted fusion</text>

    <rect x="770" y="134" width="150" height="132" rx="24" fill="#f0e9dc" stroke="#c4b294" stroke-width="2.2"/>
    <rect x="770" y="316" width="150" height="132" rx="24" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <text x="845" y="190" text-anchor="middle" font-size="24" fill="#7c6646">top-down</text>
    <text x="845" y="220" text-anchor="middle" font-size="17" fill="#5e6b73">FPN fusion</text>
    <text x="845" y="372" text-anchor="middle" font-size="26" fill="#2f4b5e">Pc</text>
    <text x="845" y="402" text-anchor="middle" font-size="17" fill="#5e6b73">coarse logits</text>

    <path d="M188 110 H250" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M188 210 H250" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M188 310 H250" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M188 410 H250" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M470 320 H538" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M470 156 H538" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M696 320 H770" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M845 266 V316" stroke="#48697d" stroke-width="3" fill="none"/>

    <text x="490" y="518" text-anchor="middle" font-size="18" fill="#5e6b73">Small dilations capture fine structure; larger dilations capture wider spatial context; soft fusion chooses the balance adaptively.</text>
  </g>
</svg>
