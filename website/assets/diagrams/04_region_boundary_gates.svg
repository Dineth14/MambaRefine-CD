<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Region boundary gates</title>
  <desc id="desc">Diagram of the region and boundary gate decomposition.</desc>
  <rect width="980" height="560" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="84" y="216" width="160" height="120" rx="24" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <text x="164" y="272" text-anchor="middle" font-size="34" fill="#2f4b5e">D_l</text>
    <text x="164" y="308" text-anchor="middle" font-size="17" fill="#5e6b73">shared differential code</text>

    <path d="M244 252 C314 252 318 166 382 166" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M244 300 C314 300 318 394 382 394" stroke="#5f8370" stroke-width="3" fill="none"/>

    <rect x="382" y="92" width="220" height="148" rx="26" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <text x="492" y="144" text-anchor="middle" font-size="26" fill="#2f4b5e">Region gate</text>
    <text x="492" y="178" text-anchor="middle" font-size="16" fill="#5e6b73">psi_r(D_l) then bounded sigmoid</text>
    <text x="492" y="210" text-anchor="middle" font-size="16" fill="#5e6b73">coherent interior support</text>

    <rect x="382" y="320" width="220" height="148" rx="26" fill="#e3efe8" stroke="#9fc0af" stroke-width="2.2"/>
    <text x="492" y="372" text-anchor="middle" font-size="26" fill="#416957">Boundary gate</text>
    <text x="492" y="406" text-anchor="middle" font-size="16" fill="#5e6b73">psi_b(grad D_l) with Sobel cue</text>
    <text x="492" y="438" text-anchor="middle" font-size="16" fill="#5e6b73">sparse contour emphasis</text>

    <path d="M602 166 H718" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M602 394 H718" stroke="#5f8370" stroke-width="3" fill="none"/>
    <polygon points="718,166 700,156 700,176" fill="#48697d"/>
    <polygon points="718,394 700,384 700,404" fill="#5f8370"/>

    <rect x="736" y="92" width="160" height="148" rx="26" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2.2"/>
    <rect x="736" y="320" width="160" height="148" rx="26" fill="#e3efe8" stroke="#9fc0af" stroke-width="2.2"/>
    <text x="816" y="154" text-anchor="middle" font-size="30" fill="#2f4b5e">R_l</text>
    <text x="816" y="188" text-anchor="middle" font-size="16" fill="#5e6b73">region stream</text>
    <text x="816" y="382" text-anchor="middle" font-size="30" fill="#416957">B_l</text>
    <text x="816" y="416" text-anchor="middle" font-size="16" fill="#5e6b73">boundary stream</text>

    <rect x="114" y="76" width="184" height="64" rx="18" fill="#f0e9dc" stroke="#c4b294" stroke-width="2"/>
    <text x="206" y="116" text-anchor="middle" font-size="16" fill="#7c6646">bounded gates prevent branch domination</text>

    <text x="490" y="518" text-anchor="middle" font-size="18" fill="#5e6b73">Region and boundary evidence are separated because they carry different spatial frequencies and different decision roles.</text>
  </g>
</svg>
