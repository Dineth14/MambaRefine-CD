<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#059669"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#db2777"/>
    </marker>
    <marker id="arr-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1100" height="460" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="24" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#0f172a">MambaRefine-CD: Full Architecture</text>

  <!-- ===== COLUMN 1: INPUTS (x=18) ===== -->
  <rect x="18" y="80" width="90" height="56" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="63" y="104" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#334155">Image A</text>
  <text x="63" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">pre-change</text>

  <rect x="18" y="192" width="90" height="56" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="63" y="216" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#334155">Image B</text>
  <text x="63" y="232" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">post-change</text>

  <!-- ===== COLUMN 2: SHARED ENCODER (x=145) ===== -->
  <line x1="108" y1="108" x2="145" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="108" y1="220" x2="145" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="148" y="62" width="134" height="216" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="215" y="84" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#4c1d95">Shared</text>
  <text x="215" y="99" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#4c1d95">MambaVision</text>
  <text x="215" y="114" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5b21b6">Encoder E</text>

  <!-- 4 scale outputs labeled in encoder -->
  <rect x="162" y="124" width="106" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="215" y="140" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4c1d95">scale 1  (stride 4)</text>

  <rect x="162" y="154" width="106" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="215" y="170" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4c1d95">scale 2  (stride 8)</text>

  <rect x="162" y="184" width="106" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="215" y="200" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4c1d95">scale 3  (stride 16)</text>

  <rect x="162" y="214" width="106" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="215" y="230" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4c1d95">scale 4  (stride 32)</text>

  <text x="215" y="264" text-anchor="middle" font-family="system-ui" font-size="9" fill="#7c3aed">F&#x2081;&#x2097;, F&#x2082;&#x2097; per scale</text>

  <!-- ===== COLUMN 3: D-RBI MODULES (x=316) ===== -->
  <!-- Arrows from encoder to D-RBI -->
  <line x1="282" y1="136" x2="316" y2="102" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-w)"/>
  <line x1="282" y1="166" x2="316" y2="142" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-w)"/>
  <line x1="282" y1="196" x2="316" y2="196" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-w)"/>
  <line x1="282" y1="226" x2="316" y2="252" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-w)"/>

  <!-- D-RBI boxes (4 scales) -->
  <rect x="319" y="68" width="130" height="56" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="384" y="90" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350f">D-RBI  l=1</text>
  <text x="384" y="107" text-anchor="middle" font-family="system-ui" font-size="10" fill="#92400e">&#x2192; R&#x2081;, B&#x2081;</text>

  <rect x="319" y="120" width="130" height="56" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="384" y="142" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350f">D-RBI  l=2</text>
  <text x="384" y="159" text-anchor="middle" font-family="system-ui" font-size="10" fill="#92400e">&#x2192; R&#x2082;, B&#x2082;</text>

  <rect x="319" y="172" width="130" height="56" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="384" y="194" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350f">D-RBI  l=3</text>
  <text x="384" y="211" text-anchor="middle" font-family="system-ui" font-size="10" fill="#92400e">&#x2192; R&#x2083;, B&#x2083;</text>

  <rect x="319" y="224" width="130" height="56" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="384" y="246" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350f">D-RBI  l=4</text>
  <text x="384" y="263" text-anchor="middle" font-family="system-ui" font-size="10" fill="#92400e">&#x2192; R&#x2084;, B&#x2084;</text>

  <!-- ===== COLUMN 4: TWO DECODER PATHS ===== -->
  <!-- Region arrows (upper path, green) -->
  <line x1="449" y1="94"  x2="510" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="449" y1="146" x2="510" y2="150" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="449" y1="198" x2="510" y2="170" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="449" y1="250" x2="510" y2="190" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- ARF-FPN -->
  <rect x="513" y="96" width="140" height="124" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="583" y="120" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#065f46">ARF-FPN</text>
  <text x="583" y="138" text-anchor="middle" font-family="system-ui" font-size="10" fill="#047857">{R&#x2097;} &#x2192; coarse map</text>
  <text x="583" y="154" text-anchor="middle" font-family="system-ui" font-size="10" fill="#047857">softmax-gated</text>
  <text x="583" y="170" text-anchor="middle" font-family="system-ui" font-size="10" fill="#047857">d = 1,2,4,8</text>

  <line x1="653" y1="158" x2="688" y2="158" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- P_c -->
  <rect x="691" y="128" width="96" height="60" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="739" y="153" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#075985">P&#x1D9C;</text>
  <text x="739" y="170" text-anchor="middle" font-family="system-ui" font-size="10" fill="#0369a1">coarse logits</text>

  <!-- Boundary arrows (lower path, pink) -->
  <line x1="449" y1="108" x2="510" y2="282" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-p)"/>
  <line x1="449" y1="160" x2="510" y2="300" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-p)"/>
  <line x1="449" y1="212" x2="510" y2="318" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-p)"/>
  <line x1="449" y1="264" x2="510" y2="336" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-p)"/>

  <!-- H_b boundary module -->
  <rect x="513" y="272" width="140" height="100" rx="8" fill="#fff1f2" stroke="#db2777" stroke-width="2"/>
  <text x="583" y="298" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#9d174d">H&#x1D47; Boundary</text>
  <text x="583" y="316" text-anchor="middle" font-family="system-ui" font-size="10" fill="#be185d">inputs: {B&#x2097;}, P&#x1D9C;</text>
  <text x="583" y="333" text-anchor="middle" font-family="system-ui" font-size="10" fill="#be185d">and &#x2207;P&#x1D9C;</text>
  <text x="583" y="350" text-anchor="middle" font-family="system-ui" font-size="10" fill="#be185d">zero-init, residual</text>

  <!-- P_c feed to boundary module -->
  <line x1="739" y1="188" x2="739" y2="250" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="739" y1="250" x2="680" y2="322" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>

  <!-- residual output -->
  <line x1="653" y1="322" x2="688" y2="322" stroke="#db2777" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- alpha tanh -->
  <rect x="691" y="294" width="96" height="56" rx="7" fill="#fff1f2" stroke="#db2777" stroke-width="1.5"/>
  <text x="739" y="318" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#9d174d">&#x03B1; tanh(&#x00B7;)</text>
  <text x="739" y="336" text-anchor="middle" font-family="system-ui" font-size="10" fill="#be185d">&#x03B1; = 0.1</text>

  <!-- Addition node -->
  <line x1="787" y1="158" x2="858" y2="230" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <line x1="787" y1="322" x2="858" y2="258" stroke="#db2777" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <circle cx="876" cy="244" r="24" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="876" y="250" text-anchor="middle" font-family="system-ui" font-size="20" fill="#334155">+</text>

  <!-- Final P_f and output -->
  <line x1="900" y1="244" x2="940" y2="244" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="943" y="210" width="140" height="68" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="2.5"/>
  <text x="1013" y="237" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#065f46">P&#x1D66;</text>
  <text x="1013" y="256" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">refined logits</text>
  <text x="1013" y="270" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">&#x03C3;(P&#x1D66;) &#x2192; change map</text>

  <!-- Bottom formula -->
  <rect x="18" y="400" width="1064" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="418" text-anchor="middle" font-family="system-ui" font-size="11" fill="#334155" font-weight="600">Key equations:</text>
  <text x="550" y="438" text-anchor="middle" font-family="system-ui" font-size="11" fill="#475569">D&#x2097; = &#x03C6;([F&#x2081;&#x2097;, F&#x2082;&#x2097;, |F&#x2082;&#x2097;&#x2212;F&#x2081;&#x2097;|, F&#x2081;&#x2097;&#x2299;F&#x2082;&#x2097;])     R&#x2097; = G&#x1D63;&#x2297;D&#x2097;     B&#x2097; = G&#x1D47;&#x2297;D&#x2097;     P&#x1D66; = P&#x1D9C; + &#x03B1; tanh(H&#x1D47;({B&#x2097;}, P&#x1D9C;, &#x2207;P&#x1D9C;))</text>
</svg>
