<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">MambaVision encoder</title>
  <desc id="desc">Shared MambaVision encoder building a four-scale feature pyramid.</desc>
  <rect width="980" height="540" fill="#fbfaf7"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="56" y="108" width="140" height="92" rx="20" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="56" y="330" width="140" height="92" rx="20" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <text x="126" y="155" text-anchor="middle" font-size="24" fill="#2f4b5e">Image I1</text>
    <text x="126" y="377" text-anchor="middle" font-size="24" fill="#416957">Image I2</text>

    <rect x="262" y="72" width="220" height="388" rx="28" fill="#f5f2ea" stroke="#b8b0a0" stroke-width="2.5"/>
    <text x="372" y="118" text-anchor="middle" font-size="30" fill="#24323a">Shared MambaVision</text>
    <text x="372" y="152" text-anchor="middle" font-size="18" fill="#5e6b73">same weights for both timestamps</text>

    <rect x="534" y="74" width="150" height="82" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="714" y="74" width="150" height="82" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="534" y="178" width="150" height="82" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="714" y="178" width="150" height="82" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="534" y="282" width="150" height="82" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="714" y="282" width="150" height="82" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>
    <rect x="534" y="386" width="150" height="82" rx="18" fill="#e4eef3" stroke="#9bb8c9" stroke-width="2"/>
    <rect x="714" y="386" width="150" height="82" rx="18" fill="#e3efe8" stroke="#9fc0af" stroke-width="2"/>

    <text x="609" y="122" text-anchor="middle" font-size="22" fill="#2f4b5e">F1^1</text>
    <text x="789" y="122" text-anchor="middle" font-size="22" fill="#416957">F2^1</text>
    <text x="609" y="226" text-anchor="middle" font-size="22" fill="#2f4b5e">F1^2</text>
    <text x="789" y="226" text-anchor="middle" font-size="22" fill="#416957">F2^2</text>
    <text x="609" y="330" text-anchor="middle" font-size="22" fill="#2f4b5e">F1^3</text>
    <text x="789" y="330" text-anchor="middle" font-size="22" fill="#416957">F2^3</text>
    <text x="609" y="434" text-anchor="middle" font-size="22" fill="#2f4b5e">F1^4</text>
    <text x="789" y="434" text-anchor="middle" font-size="22" fill="#416957">F2^4</text>

    <text x="908" y="122" font-size="16" fill="#5e6b73">detail</text>
    <text x="908" y="226" font-size="16" fill="#5e6b73">mid</text>
    <text x="908" y="330" font-size="16" fill="#5e6b73">semantic</text>
    <text x="908" y="434" font-size="16" fill="#5e6b73">global</text>

    <path d="M196 154 H262" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M196 376 H262" stroke="#48697d" stroke-width="3" fill="none"/>
    <polygon points="262,154 244,144 244,164" fill="#48697d"/>
    <polygon points="262,376 244,366 244,386" fill="#48697d"/>

    <path d="M482 140 H534" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M482 220 H534" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M482 300 H534" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M482 380 H534" stroke="#48697d" stroke-width="3" fill="none"/>
    <path d="M482 140 H714" stroke="#5f8370" stroke-width="3" fill="none" opacity="0.72"/>
    <path d="M482 220 H714" stroke="#5f8370" stroke-width="3" fill="none" opacity="0.72"/>
    <path d="M482 300 H714" stroke="#5f8370" stroke-width="3" fill="none" opacity="0.72"/>
    <path d="M482 380 H714" stroke="#5f8370" stroke-width="3" fill="none" opacity="0.72"/>

    <text x="490" y="508" font-size="18" text-anchor="middle" fill="#5e6b73">Shared encoding keeps the feature space aligned before temporal comparison.</text>
  </g>
