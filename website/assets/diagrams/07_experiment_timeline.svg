<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="240" fill="#f8fafc"/>

  <!-- Title -->
  <text x="460" y="26" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#0f172a">Design Evolution: From Diagnostics to MambaRefine-CD</text>

  <!-- Timeline axis -->
  <line x1="50" y1="100" x2="870" y2="100" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="870,96 882,100 870,104" fill="#94a3b8"/>

  <!-- Stage 1 -->
  <circle cx="120" cy="100" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <rect x="46" y="44" width="148" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="62" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#1e40af">Feature Diagnostics</text>
  <text x="120" y="78" text-anchor="middle" font-family="system-ui" font-size="10" fill="#1e40af">Frequency &amp; edge analysis</text>
  <line x1="120" y1="90" x2="120" y2="100" stroke="#3b82f6" stroke-width="1.5"/>

  <rect x="46" y="116" width="148" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="132" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">MambaVision features: deep</text>
  <text x="120" y="147" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">stages = semantic, shallow</text>
  <text x="120" y="162" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">stages = boundary evidence</text>

  <!-- Stage 2 -->
  <circle cx="320" cy="100" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <rect x="246" y="44" width="148" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#4c1d95">Decoder Experiments</text>
  <text x="320" y="78" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4c1d95">FPN baseline + RF variants</text>
  <line x1="320" y1="90" x2="320" y2="100" stroke="#7c3aed" stroke-width="1.5"/>

  <rect x="246" y="116" width="148" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="132" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">Naive sigmoid-gated dilation</text>
  <text x="320" y="147" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">collapsed. Softmax-gated</text>
  <text x="320" y="162" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">ARF stable → kept.</text>

  <!-- Stage 3 -->
  <circle cx="520" cy="100" r="14" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="520" y="105" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <rect x="446" y="44" width="148" height="46" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="62" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350f">Temporal Mamba</text>
  <text x="520" y="78" text-anchor="middle" font-family="system-ui" font-size="10" fill="#78350f">F&#x2081;,F&#x2082; as SSM sequence</text>
  <line x1="520" y1="90" x2="520" y2="100" stroke="#d97706" stroke-width="1.5"/>

  <rect x="446" y="116" width="148" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="132" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">Numerically unstable under</text>
  <text x="520" y="147" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">float16 AMP. Clarified need</text>
  <text x="520" y="162" text-anchor="middle" font-family="system-ui" font-size="10" fill="#475569">for stable differential design.</text>

  <!-- Stage 4 -->
  <circle cx="720" cy="100" r="14" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <text x="720" y="105" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <rect x="646" y="44" width="148" height="46" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="62" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#065f46">MambaRefine-CD</text>
  <text x="720" y="78" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">D-RBI + ARF + Residual</text>
  <line x1="720" y1="90" x2="720" y2="100" stroke="#059669" stroke-width="1.5"/>

  <rect x="646" y="116" width="148" height="56" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="720" y="132" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">Stable AMP training.</text>
  <text x="720" y="147" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">GroupNorm + clamping</text>
  <text x="720" y="162" text-anchor="middle" font-family="system-ui" font-size="10" fill="#065f46">verified by smoke tests.</text>

  <!-- Connecting arrows between stages -->
  <line x1="194" y1="100" x2="246" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="394" y1="100" x2="446" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="594" y1="100" x2="646" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom labels -->
  <text x="460" y="210" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">Each stage informed the next. The final design is motivated by empirical observation, not ad-hoc choices.</text>
</svg>
