debug:
  name: tiny_memory_debug
  output_root: outputs/memory_debug
  steps: 3
  batch_size: 8
  image_size: 256
  use_amp: true
  profile_torch_ops: true
  profile_one_step_only: true
  compare_modes:
    - baseline_forward_only
    - train_forward_loss_backward
    - train_with_return_features_false
    - train_with_return_features_true
    - train_with_ema_disabled
    - train_with_ema_enabled
    - train_with_tta_disabled
    - eval_no_grad
    - eval_with_tta
    - decoder_baseline
    - decoder_refinement
    - decoder_adaptive_rf
  save_memory_summary: true
  seed: 42

model:
  backbone: mambavision
  variant: tiny
  decoder: refinement
  pretrained: true
  freeze_backbone: false
  return_features: false

decoder:
  channels: 256
  dilation_rates: [1, 2, 4, 8]
  aux_weight: 0.4

dataset:
  name: LEVIR-CD
  root: /storage2/ChangeDetection/MV/Datasets/LEVIRCD
  split: train
  image_size: 256
  batch_size: 8
  num_workers: 2
  val_ratio: 0.2

training:
  lr: 0.0001
  weight_decay: 0.01
  ema_decay: 0.999

hardware:
  gpu_ids: [0]
  device: cuda
  mixed_precision: true

ema:
  enabled: false
  store_on_cpu: true

evaluation:
  use_tta: false
  tta_augmentations: [original, hflip, vflip, rot90]

loss:
  type: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
