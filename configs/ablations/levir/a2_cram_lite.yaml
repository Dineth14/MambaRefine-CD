# LEVIR-CD A2 CRAM-lite
# signed_diff: true, cram_lite: true

experiment:
  name: levir_a2_cram_lite
  output_root: outputs/levir/a2_cram_lite

dataset:
  name: LEVIR-CD
  root: /storage2/ChangeDetection/MV/Datasets/LEVIRCD
  image_size: 256
  batch_size: 8
  num_workers: 8
  augmentation: true
  val_ratio: 0.2

task: binary_cd

model:
  mode: dual
  backbone: mambavision
  variant: base
  decoder: adaptive_rf
  pretrained: true
  output_mode: binary
  enable_semantic_heads: false
  cram_lite:
    enabled: true               # <── A2: CRAM-lite enabled
    alpha: 0.5
    apply_stages: [0, 1, 2]
    attention_type: spatial

difference:
  enabled: true
  out_channels: 256
  use_absdiff: true
  use_signed_diff: true
  use_product: false
  pre_norm: true
  use_region_gate: true
  use_boundary_gate: true

decoder:
  channels: 256
  dilation_rates: [1, 2, 4, 8]
  use_boundary_residual: true
  residual_scale: 0.1

hardware:
  device: cuda
  mixed_precision: true

training:
  max_iterations: 50000
  batch_size: 8
  lr: 5.0e-5
  optimizer: adamw
  scheduler: cosine
  warmup_iterations: 2500
  validate_every: 5000
  log_every: 20
  gradient_clip: 0.5
  weight_decay: 0.01

loss:
  final:
    type: bce_dice
    bce_weight: 1.0
    dice_weight: 1.0
  coarse:
    enabled: false
    weight: 0.0
  boundary:
    enabled: false
    weight: 0.0

metrics:
  allowed: [Pre, Rec, F1, IoU, OA]

checkpoint:
  selection_metric: F1
  mode: max
