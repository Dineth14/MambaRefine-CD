benchmark:
  model_name: ours_refinement
  output_dir: outputs/benchmark_runs/summary

  # Fill in checkpoint paths after training each dataset
  checkpoints:
    levir:  null  # outputs/benchmark_runs/run_YYYYMMDD_HHMMSS_refinement_levir/checkpoints/best.pth
    whu:    null  # outputs/benchmark_runs/run_YYYYMMDD_HHMMSS_refinement_whu/checkpoints/best.pth
    sysu:   null  # outputs/benchmark_runs/run_YYYYMMDD_HHMMSS_refinement_sysu/checkpoints/best.pth
    dsifn:  null  # outputs/benchmark_runs/run_YYYYMMDD_HHMMSS_refinement_dsifn/checkpoints/best.pth

  # Dataset config paths
  dataset_configs:
    levir: configs/datasets/levircd.yaml
    whu:   configs/datasets/whucd.yaml
    sysu:  configs/datasets/sysucd.yaml
    dsifn: configs/datasets/dsifncd.yaml

  # Which datasets to include in the benchmark run
  datasets:
    - LEVIR-CD
    - WHU-CD
    - SYSU-CD
    - DSIFN-CD

  # Evaluation split per dataset
  eval_split: test

  # Main dataset for computing generalization gaps
  main_dataset: LEVIR-CD

  # Model config (same model used for all datasets)
  model:
    backbone: mambavision
    variant: small
    decoder: refinement
    pretrained: false

  hardware:
    device: cuda
    mixed_precision: true

  evaluation:
    threshold: 0.5
    save_predictions: false

  boundary_metrics:
    enabled: true
    boundary_width: 3
    tolerance: 2
