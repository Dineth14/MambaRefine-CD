dataset:
  name: WHU-CD
  root: /storage2/ChangeDetection/MV/Datasets/WHU-CD
  train_split: train
  val_split: val
  test_split: test
  image_size: 256
  val_ratio: 0.2
  augment: true
  num_workers: 8
  binary: true
  image_a_dir_candidates: ["A", "imageA", "t1", "before", "A_256"]
  image_b_dir_candidates: ["B", "imageB", "t2", "after",  "B_256"]
  label_dir_candidates: ["OUT", "label", "labels", "mask", "change_mask"]

metrics:
  core:
    - f1
    - iou
    - miou
    - precision
    - recall
    - oa
  extra:
    - boundary_f1
    - edge_iou
    - pred_positive_ratio
    - gt_positive_ratio

evaluation:
  threshold: 0.5

boundary_metrics:
  enabled: true
  boundary_width: 3
  tolerance: 2
