dataset:
  name: SYSU-CD
  root: /storage2/ChangeDetection/MV/Datasets/SYSU-CD
  train_split: train
  val_split: val
  test_split: test
  image_size: 256
  val_ratio: 0.2
  augment: true
  num_workers: 8
  binary: true
  # SYSU-CD is multi-class; all non-zero pixels treated as change
  image_a_dir_candidates: ["A", "t1", "time1", "imageA", "T1", "img1"]
  image_b_dir_candidates: ["B", "t2", "time2", "imageB", "T2", "img2"]
  label_dir_candidates: ["label", "mask", "OUT", "GT", "labels", "change_map"]

metrics:
  core:
    - f1
    - iou
    - miou
    - precision
    - recall
    - oa
  extra:
    - pred_positive_ratio
    - gt_positive_ratio
    - boundary_f1
    - edge_iou

evaluation:
  threshold: 0.5

boundary_metrics:
  enabled: true
  boundary_width: 3
  tolerance: 2
