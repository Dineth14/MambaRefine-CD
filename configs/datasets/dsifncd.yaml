dataset:
  name: DSIFN-CD
  # Extracted flat layout: DSIFN-CD/DSIFN/{t1,t2,mask}/
  root: /storage2/ChangeDetection/MV/Datasets/DSIFN-CD/DSIFN
  # Flat dataset — no train/val/test sub-dirs; val_ratio used to split
  train_split: null
  val_split: null
  test_split: null
  image_size: 256
  val_ratio: 0.2
  augment: true
  num_workers: 8
  binary: true
  image_a_dir_candidates: ["t1", "T1", "A", "imageA", "before", "img1"]
  image_b_dir_candidates: ["t2", "T2", "B", "imageB", "after",  "img2"]
  label_dir_candidates: ["mask", "GT", "label", "labels", "OUT", "change_map"]

metrics:
  core:
    - f1
    - iou
    - miou
    - precision
    - recall
    - oa
  extra:
    - pred_positive_ratio
    - gt_positive_ratio
    - boundary_f1
    - edge_iou

evaluation:
  threshold: 0.5

boundary_metrics:
  enabled: true
  boundary_width: 3
  tolerance: 2
