experiment:
  name: base
  seed: 42
  output_root: outputs

dataset:
  root: /storage2/ChangeDetection/MV/Datasets/LEVIRCD
  image_size: 256
  val_ratio: 0.2
  augment: true
  num_workers: 8

hardware:
  device: cuda:1
  mixed_precision: true

training:
  max_iterations: 50000
  batch_size: 8
  lr: 1e-4
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_iterations: 3000
  validate_every: 5000
  log_every: 20
  gradient_clip: 1.0
  # EMA — off by default, enable per experiment
  use_ema: false
  ema_decay: 0.999

validation:
  batch_size: 8
  save_samples: true
  sample_count: 16

model:
  backbone: mambavision
  variant: base          # tiny | tiny2 | small | base | large
  decoder: refinement        # baseline | adaptive_rf | refinement | global_local
  pretrained: true
  freeze_backbone: false

loss:
  type: bce_dice         # bce_dice | dice_focal
  bce_weight: 1.0
  dice_weight: 1.0
  focal_weight: 0.3      # used when type: dice_focal
  focal_gamma: 1.5       # used when type: dice_focal

decoder:
  channels: 256
  dilation_rates: [1, 2, 4, 8]

evaluation:
  threshold: 0.5
  # Threshold sweep — tries threshold_list, picks best F1 (use at test time)
  threshold_sweep: false
  threshold_list: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  # Test-Time Augmentation (use at test / benchmark time)
  use_tta: false
  tta_augmentations: [original, hflip, vflip, rot90]

checkpoint:
  monitor: f1
  mode: max

resume:
  enabled: false
  checkpoint_path: null    # relative paths resolved from repo root
  strict: true
