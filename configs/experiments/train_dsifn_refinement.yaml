base: ../base.yaml
dataset_config: ../datasets/dsifncd.yaml

experiment:
  name: refinement_dsifn
  output_root: outputs/benchmark_runs
  seed: 42

model:
  backbone: mambavision
  variant: tiny2           # tiny | tiny2 | small | base | large
  decoder: refinement
  pretrained: true
  freeze_backbone: false

training:
  max_iterations: 50000
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_iterations: 1000
  validate_every: 5000
  log_every: 20
  gradient_clip: 1.0

validation:
  batch_size: 8
  save_samples: true
  sample_count: 16

decoder:
  channels: 256
  dilation_rates: [1, 2, 4, 8]
  aux_weight: 0.4

checkpoint:
  monitor: f1
  mode: max
  save_best_only: true

resume:
  enabled: false
  checkpoint_path: null
  strict: true

hardware:
  device: cuda
  mixed_precision: true
