dataset_config: ../datasets/levircd.yaml

experiment:
  name: eval_levir
  output_root: outputs/eval_runs

model:
  backbone: mambavision
  variant: small
  decoder: refinement
  pretrained: false

evaluation:
  threshold: 0.5
  split: test
  save_predictions: true
  output_dir: outputs/eval_runs/levir

checkpoint:
  path: null   # set this to your trained checkpoint path, e.g.:
               # outputs/benchmark_runs/run_YYYYMMDD_HHMMSS_refinement_levir/checkpoints/best.pth

hardware:
  device: cuda
  mixed_precision: true

boundary_metrics:
  enabled: true
  boundary_width: 3
  tolerance: 2
