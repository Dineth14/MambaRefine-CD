# Runtime defaults for active binary change-detection experiments.

experiment:
  name: dsifn_full
  output_root: outputs/dsifn/full
  seed: 42

hardware:
  device: cuda
  gpu_ids: [0]
  mixed_precision: true

dataset:
  name: DSIFN-CD
  root: /storage2/ChangeDetection/MV/Datasets/DSIFN-CD/DSIFN
  mode: binary
  task_type: binary_change
  image_size: 256
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  val_ratio: 0.2
  augmentation: true

model:
  mode: dual
  backbone: mambavision
  variant: base
  decoder: adaptive_rf
  pretrained: true
  output_mode: binary
  num_classes: 1
  freeze_backbone: false
  drbi:
    enabled: true
  signed_diff:
    enabled: true
  cram_lite:
    enabled: true
    alpha: 0.5
    apply_stages: [0, 1, 2]
    attention_type: spatial
  arf_fpn:
    enabled: true
  boundary_refine:
    enabled: true

difference:
  enabled: true
  type: region_boundary
  out_channels: 256
  use_depthwise: true
  gate_hidden_ratio: 0.25
  pre_norm: true
  use_absdiff: true
  use_signed_diff: true
  use_product: false
  product_scale: 0.25
  use_region_gate: true
  use_boundary_gate: true
  region_gate_min: 0.2
  region_gate_max: 0.8
  boundary_gate_min: 0.0
  boundary_gate_max: 0.4
  return_debug: false

decoder:
  type: adaptive_rf
  channels: 256
  dilation_rates: [1, 2, 4, 8]
  use_boundary_residual: true
  residual_scale: 0.1
  use_depthwise: true
  aux_weight: 0.4

training:
  max_iterations: 50000
  batch_size: 8
  lr: 5.0e-5
  optimizer: adamw
  scheduler: cosine
  warmup_iterations: 2500
  validate_every: 5000
  log_every: 20
  gradient_clip: 0.5
  weight_decay: 0.01
  skip_nan_steps: true
  nan_diag_every: 50
  non_blocking_transfer: true

validation:
  batch_size: 4
  save_samples: true
  sample_count: 16
  split: val

evaluation:
  split: test
  threshold: 0.5
  threshold_sweep:
    enabled: true
    values: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  threshold_select_metric: F1_1
  use_ema: true
  inference_mode: patch
  crop_size: 256
  overlap: 0.25
  use_tta: false
  save_predictions: false

loss:
  type: bce_dice
  final:
    type: bce_dice
    bce_weight: 1.0
    dice_weight: 1.0
  coarse:
    enabled: true
    weight: 0.4
  boundary:
    enabled: true
    weight: 0.1
    type: bce_dice
    target_type: sobel
    edge_width: 3

metrics:
  allowed: [Pre, Rec, F1, IoU, OA]
  average_mode: global

ema:
  enabled: true
  decay: 0.999
  store_on_cpu: true

resume:
  enabled: false
  checkpoint_path: null
  strict: true

checkpoint:
  path: null
  monitor: f1
  mode: max
  save_best_only: true

boundary_metrics:
  enabled: true
  boundary_width: 3
  tolerance: 2

debug:
  enabled: false
  output_root: debug
